name: OSS Apex Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  AER_VERSION: v1.3.12

jobs:
  dlrs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [unpackaged, namespaced]
        include:
          - scenario: unpackaged
            namespace: ""
          - scenario: namespaced
            namespace: aertest
    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Fetch dlrs release/2.23 sources
        run: |
          set -euo pipefail
          workdir="oss/declarative-lookup-rollup-summaries"
          mkdir -p "${workdir}"
          curl -sSL https://github.com/SFDO-Community/declarative-lookup-rollup-summaries/archive/refs/tags/release/2.23.tar.gz \
            | tar xz --strip-components=1 -C "${workdir}"
          echo "DLRS_SOURCE=${workdir}/dlrs" >> "$GITHUB_ENV"

      - name: Run aer test (dlrs release/2.23)
        uses: ./
        with:
          source: ${{ env.DLRS_SOURCE }}
          version: ${{ env.AER_VERSION }}
          default-namespace: ${{ matrix.namespace }}
        env:
          AER_LICENSE_KEY: ${{ secrets.AER_LICENSE_KEY }}

  fflib-apex-mocks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [unpackaged, namespaced]
        include:
          - scenario: unpackaged
            namespace: ""
          - scenario: namespaced
            namespace: aertest
    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Fetch fflib-apex-mocks commit 0cf357a
