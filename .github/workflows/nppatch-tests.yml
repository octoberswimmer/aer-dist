name: NPPatch Apex Tests

on:
  workflow_dispatch:

env:
  AER_VERSION: v1.2.9

jobs:
  nppatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Clone nppatch repo
        run: |
          set -euo pipefail
          root="oss/nppatch"
          mkdir -p "${root}"
          workdir=$(mktemp -d "${root}/repo.XXXXXX")
          git clone https://github.com/Sundae-Shop-Consulting/nppatch.git "${workdir}"
          cd "${workdir}"
          git checkout 243cee720cd1c30ad86da2ad185940f930c8bfef
          echo "NPPATCH_ROOT=${workdir}" >> "$GITHUB_ENV"

      - name: Resolve cci-namespace release tag
        id: resolve_cci_namespace
        shell: bash
        working-directory: ${{ github.action_path }}
        run: |
          set -euo pipefail
          go run ./cmd/actions/resolve \
            --requested latest \
            --repo "cwarden/cci-namespace"

      - name: Install cci-namespace
        shell: bash
        working-directory: ${{ github.action_path }}
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          go run ./cmd/actions/install \
            --repo "${{ steps.resolve_cci_namespace.outputs.repo }}" \
            --version "${{ steps.resolve_cci_namespace.outputs.version }}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --dest "${RUNNER_TEMP}/cci-namespace" \
            --asset-prefix "cci-namespace" \
            --binary-name "cci-namespace"

      - name: Namespace nppatch source
        run: |
          set -euo pipefail
          cci-namespace -path "${NPPATCH_ROOT}"

      - name: Set nppatch source paths
        id: nppatch_paths
        run: |
          set -euo pipefail
          {
            echo "source<<EOF"
            printf '%s\n' \
              "${NPPATCH_ROOT}/force-app/" \
              "${NPPATCH_ROOT}/unpackaged/config/"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run aer test (nppatch)
        uses: ./
        with:
          source: ${{ steps.nppatch_paths.outputs.source }}
          version: ${{ env.AER_VERSION }}
          default-namespace: nppatch
          flags: >-
            --skip nppatch.CONV_Account_Conversion_BATCH_TEST.testAccountConversion1to1
        env:
          AER_LICENSE_KEY: ${{ secrets.AER_LICENSE_KEY }}
